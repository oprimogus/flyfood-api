info:
  contact:
    email: gustavo081900@gmail.com
    name: Gustavo Ferreira de Jesus
  description: Documentação da API de delivery FlyFood.
  title: FlyFood API
  version: "1.0"
paths:
  /health/liveness:
    get:
      description: Liveness Prob
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_controller.HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_controller.HealthResponse'
      summary: Liveness Prob
      tags:
      - Health
  /health/metrics:
    get:
      description: Prometheus Metrics
      produces:
      - text/plain
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_controller.HealthResponse'
      summary: Prometheus Metrics
      tags:
      - Health
  /health/readiness:
    get:
      description: Readiness Prob
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_controller.HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api_controller.HealthResponse'
      summary: Readiness Prob
      tags:
      - Health
  /v1/customer:
    get:
      consumes:
      - application/json
      description: Register a comprehensive customer profile with full registration
        details
      produces:
      - application/json
      responses:
        "200":
          description: Customer
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_core_customer.Customer'
        "201":
          description: Customer
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_core_customer.Customer'
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "409":
          description: Conflict - customer may already exist
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "422":
          description: Validation error - invalid customer details
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "502":
          description: External service communication error
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
      summary: Get a customer account
      tags:
      - Customer Profile Management V1
    put:
      consumes:
      - application/json
      description: Modify comprehensive customer account details with full profile
        update
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Updated customer profile information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_core_customer.UpdateProfileDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Profile successfully updated
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "401":
          description: Unauthorized - authentication required
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "403":
          description: Forbidden - insufficient permissions
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "404":
          description: Customer profile not found
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "422":
          description: Validation error - invalid profile details
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Update existing customer profile
      tags:
      - Customer Profile Management V1
  /v1/customer/address:
    delete:
      consumes:
      - application/json
      description: Remove an address to customer
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Address Model
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_core_address.Address'
      produces:
      - application/json
      responses:
        "200":
          description: Address removed from user
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "401":
          description: Unauthorized - authentication required
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "403":
          description: Forbidden - insufficient permissions
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "404":
          description: Customer profile not found
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "422":
          description: Validation error - invalid profile details
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Remove an address to customer
      tags:
      - Customer Profile Management V1
    post:
      consumes:
      - application/json
      description: Add new address to customer
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Address Model
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oprimogus_flyfood-api_internal_core_address.Address'
      produces:
      - application/json
      responses:
        "200":
