info:
  contact:
    email: gustavo081900@gmail.com
    name: Gustavo Ferreira de Jesus
  description: Documentação da API de delivery FlyFood.
  title: FlyFood API
  version: "1.0"
openapi: 3.1.0
paths:
  /health/liveness:
    get:
      description: Liveness Prob
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api_controller.HealthResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api_controller.HealthResponse'
          description: Internal Server Error
      summary: Liveness Prob
      tags:
      - Health
  /health/metrics:
    get:
      description: Prometheus Metrics
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api_controller.HealthResponse'
          description: Internal Server Error
      summary: Prometheus Metrics
      tags:
      - Health
  /health/readiness:
    get:
      description: Readiness Prob
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api_controller.HealthResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api_controller.HealthResponse'
          description: Internal Server Error
      summary: Readiness Prob
      tags:
      - Health
  /v1/customer:
    get:
      description: Register a comprehensive customer profile with full registration
        details
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_core_customer.Customer'
          description: Customer
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_core_customer.Customer'
          description: Customer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Invalid request data or malformed JSON
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Conflict - customer may already exist
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Validation error - invalid customer details
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Internal server error
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: External service communication error
      summary: Get a customer account
      tags:
      - Customer Profile Management V1
    put:
      description: Modify comprehensive customer account details with full profile
        update
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_core_customer.UpdateProfileDTO'
        description: Updated customer profile information
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Profile successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Invalid request data or malformed JSON
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Unauthorized - authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Forbidden - insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Customer profile not found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Validation error - invalid profile details
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update existing customer profile
      tags:
      - Customer Profile Management V1
  /v1/customer/address:
    delete:
      description: Remove an address to customer
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_core_address.Address'
        description: Address Model
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Address removed from user
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Invalid request data or malformed JSON
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Unauthorized - authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_oprimogus_flyfood-api_internal_xerrors.CustomError'
          description: Forbidden - insufficient permissions
        "404":
          content:
            application/json:
              schema:
