paths:
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh an expired access token by providing a valid refresh token.
        Returns a new JWT if the refresh is successful.
      parameters:
      - description: Request body containing the refresh token.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authentication.RefreshParams'
      produces:
      - application/json
      responses:
        "200":
          description: Returns a new JWT upon successful token refresh.
          schema:
            $ref: '#/definitions/authentication.JWT'
        "400":
          description: Bad request due to validation errors or malformed input.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "500":
          description: Internal server error, something went wrong while processing
            the request.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "502":
          description: Bad gateway, likely due to an external service failure.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
      summary: Refresh JWT using a refresh token
      tags:
      - Authentication
  /v1/auth/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate a user using their email and password. If successful,
        a JWT is returned which can be used for subsequent authenticated requests.
      parameters:
      - description: Request body containing email and password.
        in: body
        name: request
        schema:
          $ref: '#/definitions/authentication.SignInParams'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the generated JWT upon successful authentication.
          schema:
            $ref: '#/definitions/authentication.JWT'
        "400":
          description: Bad request due to validation errors or malformed input.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "500":
          description: Internal server error, something went wrong while processing
            the request.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "502":
          description: Bad gateway, likely due to an external service failure.
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
      summary: Sign-In with email and password
      tags:
      - Authentication
  /v1/auth/sign-up:
    post:
      consumes:
      - application/json
      description: Sign-Up with local credentials and data
      parameters:
      - description: CreateUserParams
        in: body
        name: request
        schema:
          $ref: '#/definitions/user.CreateParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
      summary: Sign-Up with local credentials and data
      tags:
      - Authentication
  /v1/store:
    get:
      consumes:
      - application/json
      description: Fetches stores based on a set of filters such as range, score,
        name, city, or type.
      parameters:
      - description: Specify max range
        in: query
        name: range
        type: integer
      - description: Specify in score
        in: query
        name: score
        type: integer
      - description: Specify name like
        in: query
        name: name
        type: string
      - description: Specify city
        in: query
        name: city
        type: string
      - description: latitude of address selected
        in: query
        name: latitude
        type: string
      - description: longitude of address selected
        in: query
        name: longitude
        type: string
      - description: Specify store type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.GetStoreByIdOutput'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
      summary: Any user can view filtered stores.
      tags:
      - Store
    post:
      consumes:
      - application/json
      description: Allows an owner to create a new store.
      parameters:
      - description: Parameters for creating a store
        in: body
        name: Params
        required: true
        schema:
          $ref: '#/definitions/store.CreateParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.CreatedStore'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/xerrors.ErrorResponse'
      security:
      - BearerToken: []
      summary: Owner can create stores.
      tags:
      - Store
    put:
      consumes:
      - application/json
      description: Allows an owner to update the details of their store.
      parameters:
