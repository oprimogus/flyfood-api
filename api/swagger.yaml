        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Change store's operational status for orders
      tags:
      - Store Management
  /v1/store/payment-method:
    delete:
      consumes:
      - application/json
      description: Delete a previously added payment method from store's accepted
        methods
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Payment method to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/store.AddOrDeletePaymentMethodDTO'
      produces:
      - application/json
