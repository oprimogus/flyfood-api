basePath: /api
consumes:
- application/json
definitions:
  address.Address:
    properties:
      addressLine1:
        maxLength: 40
        type: string
      addressLine2:
        maxLength: 20
        type: string
      city:
        maxLength: 25
        type: string
      country:
        maxLength: 15
        type: string
      latitude:
        type: string
      longitude:
        type: string
      neighborhood:
        maxLength: 25
        type: string
      postalCode:
        maxLength: 15
        type: string
      state:
        maxLength: 15
        type: string
    required:
    - addressLine1
    - addressLine2
    - city
    - country
    - neighborhood
    - postalCode
    - state
    type: object
  authentication.JWT:
    properties:
      accessToken:
        example: eysjs9a...
        type: string
      expiresIn:
        example: 300
        type: integer
      idToken:
        example: eysjg54g3ba...
        type: string
      notBeforePolicy:
        example: 150
        type: integer
      refreshExpiresIn:
        example: 300
        type: integer
      refreshToken:
        example: eynmiks.ewij...
        type: string
      scope:
        example: email client user ...
        type: string
      sessionState:
        example: 634g43y3...
        type: string
      tokenType:
        example: Bearer
        type: string
    type: object
  authentication.RefreshParams:
    properties:
      refreshToken:
        example: eyajbhhkd.....
        type: string
    required:
    - refreshToken
    type: object
  authentication.SignInParams:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: '*********'
        type: string
    required:
    - email
    - password
    type: object
  controller.setFileOutput:
    properties:
      objectURL:
        example: URL of object on storage
        type: string
    type: object
  item.CreateItemInput:
    properties:
      description:
        example: The best burguer!
        maxLength: 50
        type: string
      details:
        additionalProperties: true
        type: object
      name:
        example: Hamburguer
        maxLength: 25
        type: string
      price:
        example: 2990
        minimum: 0
        type: integer
      storeID:
        example: 3279gbf23gb-fb23-6f239
        type: string
      type:
        allOf:
        - $ref: '#/definitions/item.Type'
        enum:
        - FOOD
        - ' WATERGALLON'
    required:
    - description
    - name
    - price
    - storeID
    - type
    type: object
  item.CreatedItem:
    properties:
      id:
        type: integer
    type: object
  item.GetItemByIDOutput:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: Com blend de 150g e molho especial.
        maxLength: 50
        type: string
      details:
        additionalProperties: true
        type: object
      discountActive:
        example: true
        type: boolean
      discountPrice:
        example: 2499
        minimum: 0
        type: integer
      image:
        example: https://cardapiogo.com.br/fgbjkgr7erg793bj3lk
        type: string
      name:
        example: Hambúrguer Artesanal
        maxLength: 25
        type: string
      price:
        example: 2990
        minimum: 0
        type: integer
      score:
        example: 475
        type: integer
      storeID:
        example: 3279gbf23gb-fb23-6f239
        type: string
      type:
        allOf:
        - $ref: '#/definitions/item.Type'
        enum:
        - FOOD
        - ' WATERGALLON'
    required:
    - active
    - description
    - discountActive
    - discountPrice
    - image
    - name
    - price
    - score
    - storeID
    - type
    type: object
  item.Type:
    enum:
    - FOOD
    - WATERGALLON
    type: string
    x-enum-varnames:
    - Food
    - WaterGallon
  item.UpdateItemInput:
    properties:
      active:
        type: boolean
      description:
        maxLength: 50
        type: string
      details:
        additionalProperties: true
        type: object
      discountActive:
        type: boolean
      discountPrice:
        minimum: 0
        type: integer
      id:
        example: 246643
        type: integer
      name:
        maxLength: 25
        type: string
      price:
        minimum: 0
        type: integer
      storeID:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/item.Type'
        enum:
        - FOOD
        - ' WATERGALLON'
    required:
    - active
    - description
    - discountActive
    - discountPrice
    - id
    - name
    - price
    - storeID
    - type
    type: object
  store.AddressOutput:
    properties:
      addressLine1:
        type: string
      addressLine2:
        type: string
      city:
        type: string
      country:
        type: string
      neighborhood:
        type: string
      state:
        type: string
    type: object
  store.BusinessHoursParams:
    properties:
      closingTime:
        type: string
      openingTime:
        type: string
      weekDay:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - closingTime
    - openingTime
    type: object
  store.CreateParams:
    properties:
      address:
        $ref: '#/definitions/address.Address'
      cpfCnpj:
        example: "83193927805"
        type: string
      name:
        example: John
        maxLength: 25
        type: string
      phone:
        example: "13997590579"
        type: string
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    required:
    - address
    - cpfCnpj
    - name
    - phone
    - type
    type: object
  store.CreatedStore:
    properties:
      id:
        type: string
    type: object
  store.GetStoreByIdOutput:
    properties:
      address:
        $ref: '#/definitions/store.AddressOutput'
      businessHours:
        items:
          $ref: '#/definitions/store.BusinessHoursParams'
        type: array
      headerImage:
        type: string
      id:
        type: string
      name:
        type: string
      paymentMethod:
        items:
          $ref: '#/definitions/store.PaymentMethod'
          enum:
          - credit
          - ' debit'
          - ' pix'
          - ' cash'
        type: array
      phone:
        type: string
      profileImage:
        type: string
      score:
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    type: object
  store.PaymentMethod:
    enum:
    - credit
    - debit
    - pix
    - cash
    type: string
    x-enum-varnames:
    - Credit
    - Debit
    - Pix
    - Cash
  store.ShopType:
    enum:
    - restaurant
    - pharmacy
    - tobbaco
    - market
    - convenience
    - pub
    type: string
    x-enum-varnames:
    - Restaurant
    - Pharmacy
    - Tobbaco
    - Market
    - Convenience
    - Pub
  store.StoreBusinessHoursParams:
    properties:
      businessHours:
        items:
          $ref: '#/definitions/store.BusinessHoursParams'
        type: array
      id:
        type: string
      timeZone:
        type: string
    required:
    - id
    - timeZone
    type: object
  store.UpdateParams:
    properties:
      address:
        $ref: '#/definitions/address.Address'
      id:
        type: string
      name:
        maxLength: 25
        type: string
      paymentMethod:
        items:
          $ref: '#/definitions/store.PaymentMethod'
          enum:
          - credit
          - ' debit'
          - ' pix'
          - ' cash'
        type: array
      phone:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    required:
    - address
    - id
    - name
    - phone
    - type
    type: object
  user.AddRolesParams:
    properties:
      roles:
        items:
          $ref: '#/definitions/user.Role'
          enum:
          - consumer
          - ' delivery_man'
          - ' owner'
          - ' employee'
        type: array
    required:
    - roles
    type: object
  user.CreateParams:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: '*********'
        type: string
      profile:
        $ref: '#/definitions/user.CreateProfileParams'
    required:
    - email
    - password
    - profile
    type: object
  user.CreateProfileParams:
    properties:
      lastName:
        example: Doe
        type: string
      name:
        example: John
        type: string
      phone:
        example: "13997590579"
        type: string
    required:
    - lastName
    - name
    - phone
    type: object
  user.Role:
    enum:
    - consumer
    - owner
    - employee
    - delivery_man
    - admin
    type: string
    x-enum-varnames:
    - RoleConsumer
    - RoleOwner
    - RoleEmployee
    - RoleDeliveryMan
    - RoleAdmin
  user.UpdateProfileParams:
    properties:
      lastName:
        example: Doe
        type: string
      name:
        example: John
        type: string
      phone:
        example: "13997590579"
        type: string
    required:
    - lastName
    - name
    - phone
    type: object
  xerrors.CustomError:
    properties:
      debug: {}
      details: {}
      error:
        type: string
      traceID:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: gustavo081900@gmail.com
    name: Gustavo Ferreira de Jesus
  description: Documentação da API de delivery Cardapiogo.
  title: Cardapiogo API
  version: "1.0"
paths:
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh an expired access token by providing a valid refresh token.
        Returns a new JWT if the refresh is successful.
      parameters:
      - description: Request body containing the refresh token.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authentication.RefreshParams'
      produces:
      - application/json
      responses:
        "200":
          description: Returns a new JWT upon successful token refresh.
          schema:
            $ref: '#/definitions/authentication.JWT'
        "400":
          description: Bad request due to validation errors or malformed input.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error, something went wrong while processing
            the request.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway, likely due to an external service failure.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      summary: Refresh JWT using a refresh token
      tags:
      - Authentication
  /v1/auth/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate a user using their email and password. If successful,
        a JWT is returned which can be used for subsequent authenticated requests.
      parameters:
      - description: Request body containing email and password.
        in: body
        name: request
        schema:
          $ref: '#/definitions/authentication.SignInParams'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the generated JWT upon successful authentication.
          schema:
            $ref: '#/definitions/authentication.JWT'
        "400":
          description: Bad request due to validation errors or malformed input.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error, something went wrong while processing
            the request.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway, likely due to an external service failure.
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      summary: Sign-In with email and password
      tags:
      - Authentication
  /v1/auth/sign-up:
    post:
      consumes:
      - application/json
      description: Register a new user with provided credentials and profile information
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateParams'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully created
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: External service error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      summary: Create a new user account
      tags:
      - Authentication
  /v1/store:
    get:
      consumes:
      - application/json
      description: |-
        Returns a list of stores based on various filter criteria including location, rating, and type.
        Supports geographic search with radius filtering when latitude and longitude are provided.
      parameters:
      - description: Maximum distance range in kilometers for geographical search
        in: query
        name: range
        type: integer
      - description: Minimum rating score (1-5)
        in: query
        name: score
        type: integer
      - description: Store name for partial matching
        in: query
        name: name
        type: string
      - description: Filter by city name
        in: query
        name: city
        type: string
      - description: Latitude for geographical search (requires longitude)
        in: query
        name: latitude
        type: string
      - description: Longitude for geographical search (requires latitude)
        in: query
        name: longitude
        type: string
      - description: Store type category (e.g., restaurant, cafe, bar)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of stores matching the filter criteria
          schema:
            items:
              $ref: '#/definitions/store.GetStoreByIdOutput'
            type: array
        "400":
          description: Invalid filter parameters
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "404":
          description: No stores found
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      summary: Search and filter stores
      tags:
      - Store
    post:
      consumes:
      - application/json
      description: |-
        Allows authenticated users to register a new store in the system.
        The store owner must provide essential information including name, location, and contact details.
      parameters:
      - description: Store creation parameters including name, address, contact info,
          and type
        in: body
        name: Params
        required: true
        schema:
          $ref: '#/definitions/store.CreateParams'
      produces:
      - application/json
      responses:
        "201":
          description: Returns the created store ID
          schema:
            $ref: '#/definitions/store.CreatedStore'
        "400":
          description: Invalid input parameters
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User lacks permission
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "409":
          description: Conflict - Store already exists
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Create a new store
      tags:
      - Store
    put:
      consumes:
      - application/json
      description: |-
        Allows store owners to modify their store's details and settings.
        All provided fields will be updated while maintaining existing data for omitted fields.
      parameters:
      - description: Updated store information including modifiable fields
        in: body
        name: Params
        required: true
        schema:
          $ref: '#/definitions/store.UpdateParams'
      produces:
      - application/json
      responses:
        "200":
          description: Store successfully updated
        "400":
          description: Invalid input parameters
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User is not the store owner
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "404":
          description: Store not found
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "409":
          description: Conflict with existing data
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Update store information
      tags:
      - Store
  /v1/store/{id}:
    get:
      consumes:
      - application/json
      description: |-
        Returns detailed information about a store by its ID.
        This endpoint is publicly accessible and provides store details including business hours,
        contact information, location, and current status.
      parameters:
      - description: Store ID - Unique identifier of the store
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Store details including name, description, business hours,
            and contact info
          schema:
            $ref: '#/definitions/store.GetStoreByIdOutput'
        "404":
          description: Store not found
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      summary: Retrieve a specific store
      tags:
      - Store
  /v1/store/{id}/header-image:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Allows store owners to upload or update their store's header/banner image.
        Supports JPEG and PNG formats. Image will be processed and optimized for display.
      parameters:
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Header image file (JPEG/PNG only, max size: 5MB)'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Returns URL of the uploaded image
          schema:
            $ref: '#/definitions/controller.setFileOutput'
        "400":
          description: Invalid file format or size
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User is not the store owner
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "413":
          description: File size exceeds limit
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Upload store header image
      tags:
      - Store
  /v1/store/{id}/profile-image:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Allows store owners to upload or update their store's profile image.
        Supports JPEG and PNG formats. Image will be processed and optimized for display.
      parameters:
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Profile image file (JPEG/PNG only, max size: 5MB)'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Returns URL of the uploaded image
          schema:
            $ref: '#/definitions/controller.setFileOutput'
        "400":
          description: Invalid file format or size
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User is not the store owner
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "413":
          description: File size exceeds limit
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Upload store profile image
      tags:
      - Store
  /v1/store/business-hours:
    delete:
      consumes:
      - application/json
      description: |-
        Allows store owners to delete specific business hours or operating schedules.
        Can be used to remove regular hours or special holiday schedules.
      parameters:
      - description: Business hours to be removed
        in: body
        name: Params
        required: true
        schema:
          $ref: '#/definitions/store.StoreBusinessHoursParams'
      produces:
      - application/json
      responses:
        "200":
          description: Business hours successfully deleted
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User is not the store owner
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "404":
          description: Business hours not found
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Remove store business hours
      tags:
      - Store
    put:
      consumes:
      - application/json
      description: |-
        Allows store owners to set or update their store's operating hours.
        Supports setting different hours for each day of the week and special holiday schedules.
      parameters:
      - description: Business hours configuration including days, opening and closing
          times
        in: body
        name: Params
        required: true
        schema:
          $ref: '#/definitions/store.StoreBusinessHoursParams'
      produces:
      - application/json
      responses:
        "200":
          description: Business hours successfully updated
        "400":
          description: Invalid time format or parameters
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - Bearer token missing or invalid
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "403":
          description: Forbidden - User is not the store owner
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "409":
          description: Conflict with existing business hours
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "502":
          description: Bad gateway
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerToken: []
      summary: Add store business hours
      tags:
      - Store
  /v1/store/item:
    get:
      consumes:
      - application/json
      description: |-
        Returns a list of store items based on the provided filter criteria.
        Supports filtering by type, name, city, score, and maximum price.
      parameters:
      - description: Filter by item type
        in: query
        name: type
        type: string
      - description: Filter by item name (partial match)
        in: query
        name: name
