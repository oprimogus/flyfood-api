      - description: IsOpen
        in: query
        name: isOpen
        required: true
        type: string
      - description: Score
        in: query
        name: score
        required: true
        type: integer
      - description: Store Type
        in: query
        name: type
        required: true
        type: string
      - description: City
        in: query
        name: city
        required: true
        type: string
      - description: Page
        in: query
        name: page
        required: true
        type: string
      - description: Items per page
        in: query
        name: maxItems
        required: true
        type: string
      produces:
