basePath: /api
consumes:
- application/json
definitions:
  address.Address:
    properties:
      addressLine1:
        maxLength: 40
        type: string
      addressLine2:
        maxLength: 20
        type: string
      city:
        maxLength: 25
        type: string
      country:
        maxLength: 15
        type: string
      latitude:
        type: string
      longitude:
        type: string
      neighborhood:
        maxLength: 25
        type: string
      postalCode:
        maxLength: 15
        type: string
      state:
        maxLength: 15
        type: string
    required:
    - addressLine1
    - addressLine2
    - city
    - country
    - neighborhood
    - postalCode
    - state
    type: object
  authentication.JWT:
    properties:
      accessToken:
        example: eysjs9a...
        type: string
      expiresIn:
        example: 300
        type: integer
      idToken:
        example: eysjg54g3ba...
        type: string
      notBeforePolicy:
        example: 150
        type: integer
      refreshExpiresIn:
        example: 300
        type: integer
      refreshToken:
        example: eynmiks.ewij...
        type: string
      scope:
        example: email client user ...
        type: string
      sessionState:
        example: 634g43y3...
        type: string
      tokenType:
        example: Bearer
        type: string
    type: object
  authentication.RefreshParams:
    properties:
      refreshToken:
        example: eyajbhhkd.....
        type: string
    required:
    - refreshToken
    type: object
  authentication.SignInParams:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: '*********'
        type: string
    required:
    - email
    - password
    type: object
  controller.setFileOutput:
    properties:
      objectURL:
        example: URL of object on storage
        type: string
    type: object
  item.CreateItemInput:
    properties:
      description:
        example: The best burguer!
        maxLength: 50
        type: string
      details:
        additionalProperties: true
        type: object
      name:
        example: Hamburguer
        maxLength: 25
        type: string
      price:
        example: 2990
        minimum: 0
        type: integer
      storeID:
        example: 3279gbf23gb-fb23-6f239
        type: string
      type:
        allOf:
        - $ref: '#/definitions/item.ItemType'
        enum:
        - FOOD
        - ' WATERGALLON'
    required:
    - description
    - name
    - price
    - storeID
    - type
    type: object
  item.CreatedItem:
    properties:
      id:
        type: integer
    type: object
  item.GetItemByIDOutput:
    properties:
      active:
        example: true
        type: boolean
      description:
        example: Com blend de 150g e molho especial.
        maxLength: 50
        type: string
      details:
        additionalProperties: true
        type: object
      discountActive:
        example: true
        type: boolean
      discountPrice:
        example: 2499
        minimum: 0
        type: integer
      image:
        example: https://cardapiogo.com.br/fgbjkgr7erg793bj3lk
        type: string
      name:
        example: Hambúrguer Artesanal
        maxLength: 25
        type: string
      price:
        example: 2990
        minimum: 0
        type: integer
      score:
        example: 475
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/item.ItemType'
        enum:
        - FOOD
        - ' WATERGALLON'
    required:
    - active
    - description
    - discountActive
    - discountPrice
    - image
    - name
    - price
    - score
    - type
    type: object
  item.ItemType:
    enum:
    - FOOD
    - WATERGALLON
    type: string
    x-enum-varnames:
    - FoodItemType
    - WaterGallonItemType
  store.AddressOutput:
    properties:
      addressLine1:
        type: string
      addressLine2:
        type: string
      city:
        type: string
      country:
        type: string
      neighborhood:
        type: string
      state:
        type: string
    type: object
  store.BusinessHoursParams:
    properties:
      closingTime:
        type: string
      openingTime:
        type: string
      weekDay:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - closingTime
    - openingTime
    type: object
  store.CreateParams:
    properties:
      address:
        $ref: '#/definitions/address.Address'
      cpfCnpj:
        example: "83193927805"
        type: string
      name:
        example: John
        maxLength: 25
        type: string
      phone:
        example: "13997590579"
        type: string
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    required:
    - address
    - cpfCnpj
    - name
    - phone
    - type
    type: object
  store.CreatedStore:
    properties:
      id:
        type: string
    type: object
  store.GetStoreByIdOutput:
    properties:
      address:
        $ref: '#/definitions/store.AddressOutput'
      businessHours:
        items:
          $ref: '#/definitions/store.BusinessHoursParams'
        type: array
      headerImage:
        type: string
      id:
        type: string
      name:
        type: string
      paymentMethod:
        items:
          $ref: '#/definitions/store.PaymentMethod'
          enum:
          - credit
          - ' debit'
          - ' pix'
          - ' cash'
        type: array
      phone:
        type: string
      profileImage:
        type: string
      score:
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    type: object
  store.PaymentMethod:
    enum:
    - credit
    - debit
    - pix
    - cash
    type: string
    x-enum-varnames:
    - Credit
    - Debit
    - Pix
    - Cash
  store.ShopType:
    enum:
    - restaurant
    - pharmacy
    - tobbaco
    - market
    - convenience
    - pub
    type: string
    x-enum-varnames:
    - StoreShopRestaurant
    - StoreShopPharmacy
    - StoreShopTobbaco
    - StoreShopMarket
    - StoreShopConvenience
    - StoreShopPub
  store.StoreBusinessHoursParams:
    properties:
      businessHours:
        items:
          $ref: '#/definitions/store.BusinessHoursParams'
        type: array
      id:
        type: string
      timeZone:
        type: string
    required:
    - id
    - timeZone
    type: object
  store.UpdateParams:
    properties:
      address:
        $ref: '#/definitions/address.Address'
      id:
        type: string
      name:
        maxLength: 25
        type: string
      paymentMethod:
        items:
          $ref: '#/definitions/store.PaymentMethod'
          enum:
          - credit
          - ' debit'
          - ' pix'
          - ' cash'
        type: array
      phone:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/store.ShopType'
        enum:
        - restaurant
        - ' pharmacy'
        - ' tobbaco'
        - ' market'
        - ' convenience'
        - ' pub'
    required:
    - address
    - id
    - name
    - phone
    - type
    type: object
  user.AddRolesParams:
    properties:
      roles:
        items:
          $ref: '#/definitions/user.Role'
          enum:
          - consumer
          - ' delivery_man'
          - ' owner'
          - ' employee'
        type: array
    required:
    - roles
    type: object
  user.CreateParams:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: '*********'
        type: string
      profile:
        $ref: '#/definitions/user.CreateProfileParams'
    required:
    - email
    - password
    - profile
    type: object
  user.CreateProfileParams:
    properties:
      lastName:
        example: Doe
        type: string
      name:
        example: John
        type: string
      phone:
        example: "13997590579"
        type: string
    required:
    - lastName
    - name
    - phone
    type: object
  user.Role:
    enum:
    - consumer
    - owner
    - employee
    - delivery_man
    - admin
    type: string
    x-enum-varnames:
    - RoleConsumer
    - RoleOwner
    - RoleEmployee
    - RoleDeliveryMan
    - RoleAdmin
  user.UpdateProfileParams:
    properties:
      lastName:
        example: Doe
        type: string
      name:
        example: John
        type: string
      phone:
        example: "13997590579"
        type: string
    required:
    - lastName
    - name
    - phone
    type: object
  xerrors.ErrorResponse:
    properties:
      debug: {}
      details: {}
      error:
        type: string
      transactionID:
        type: string
    type: object
