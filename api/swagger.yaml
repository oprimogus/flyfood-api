      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Updated store information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/store.UpdateStoreDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Store successfully updated
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - authentication required
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "404":
          description: Store not found
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "422":
          description: Validation error - invalid store details
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Update existing store profile
      tags:
      - Store Management
  /v1/store/:id:
    get:
      description: Get a store by ID
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Store ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Query Store model
          schema:
            $ref: '#/definitions/store.QueryStore'
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - authentication required
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "422":
          description: Validation error - invalid status
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Get a store by ID
      tags:
      - Store
  /v1/store/{id}/header-image:
    post:
      consumes:
      - multipart/form-data
      description: Change store header image
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      - description: Store header image
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Store activation status updated successfully
