          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Remove payment method for store
      tags:
      - Store Management
    post:
      consumes:
      - application/json
      description: Register a new payment method accepted by the store
      parameters:
      - description: Bearer authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Payment method details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/store.AddOrDeletePaymentMethodDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Payment method successfully added
        "400":
          description: Invalid request data or malformed JSON
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "401":
          description: Unauthorized - authentication required
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "422":
          description: Validation error - invalid payment method
          schema:
            $ref: '#/definitions/xerrors.CustomError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/xerrors.CustomError'
      security:
      - BearerAuth: []
      summary: Add payment method for store
      tags:
      - Store Management
produces:
- application/json
securityDefinitions:
  BearerToken:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
