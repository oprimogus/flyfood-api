name: Pull Request Pipeline
env:
    GO_VERSION: '1.24.0'
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
            go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Cache go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        
      - name: Download dependencies
        run: go mod download

      - name: Cache go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Create .env file
        run: |
          echo "APP_REPO=${{ github.event.repository.name }}" >> .env
          echo "APP_NAME=${{ github.event.repository.name }}" >> .env

      - name: Run Unit Tests
        run: make test-ci

      - name: Run Integration Tests
        run: make test-integration-ci
