name: Deploy Pipeline

env:
    GO_VERSION: '1.26.2'
    
on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
      name: Run Tests
      runs-on: ubuntu-latest
      environment: production
      steps:
        - uses: actions/checkout@v4
  
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: ${{ env.GO_VERSION }}
            
        - name: Download dependencies
          run: go mod download
  
        - name: Cache go build
          uses: actions/cache@v4
          with:
            path: ~/.cache/go-build
            key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
            restore-keys: |
              ${{ runner.os }}-go-build-
  
        - name: Create .env file
          run: |
            echo "APP_REPO=${{ github.event.repository.name }}" >> .env
            echo "APP_NAME=${{ github.event.repository.name }}" >> .env
  
        - name: Run Unit Tests
          run: make test-ci
  
        - name: Run Integration Tests
          run: make test-integration-ci

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_TOKEN }}
  
      - name: Build and push Image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ github.ref_name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ github.ref_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max



