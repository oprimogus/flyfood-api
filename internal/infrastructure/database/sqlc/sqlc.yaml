version: "2"
sql:
  - engine: "postgresql"
    queries: "../sql/query.sql"
    schema: "../sql/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "."
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_json_tags: true
        emit_exact_table_names: true
        json_tags_case_style: "snake"
        emit_sql_as_comment: true